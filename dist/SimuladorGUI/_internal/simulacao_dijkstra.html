<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação: Rota Dijkstra (Aracaju ➔ UFS)</title>
    <!-- Leaflet CSS & JS Oficiais (CDN cdnjs) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e2e8f0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Animação SVG nativa para a linha de rota */
        .rota-animada {
            stroke-dasharray: 12, 12;
            animation: dashRota 1.2s linear infinite;
        }
        @keyframes dashRota {
            to { stroke-dashoffset: -24; }
        }
        /* HUD Flutuante */
        .hud-painel {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.96);
            color: #f8fafc;
            padding: 20px 24px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            min-width: 350px;
            max-width: 440px;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
        }
        .hud-titulo {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .hud-metricas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .hud-caixa {
            background: rgba(255,255,255,0.06);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .hud-caixa .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
        }
        .hud-caixa .valor {
            font-size: 16px;
            font-weight: 700;
            color: #4ade80;
            margin-top: 2px;
        }
        .hud-controles {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }
        .hud-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .hud-btn-reset {
            background: #475569;
        }
        .hud-btn-reset:hover {
            background: #334155;
        }
        .hud-select {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .hud-progresso {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            margin-top: 14px;
            overflow: hidden;
        }
        .hud-barra {
            width: 0%;
            height: 100%;
            background: #38bdf8;
            transition: width 0.15s ease-out;
        }
        /* Marcador de Carro com Badge de Estado Semafórico */
        .car-marker-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            margin-left: -70px;
            margin-top: -42px;
            pointer-events: none;
        }
        .car-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            color: #fff;
            white-space: nowrap;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            margin-bottom: 2px;
            transition: all 0.2s ease;
        }
        .badge-green {
            background: #16a34a;
            border: 1px solid #4ade80;
        }
        .badge-yellow {
            background: #d97706;
            border: 1px solid #fde047;
            animation: pulseYellow 0.6s infinite alternate;
        }
        .badge-red {
            background: #dc2626;
            border: 1px solid #f87171;
            animation: pulseRed 0.6s infinite alternate;
        }
        @keyframes pulseRed {
            from { transform: scale(1); box-shadow: 0 0 5px #ef4444; }
            to { transform: scale(1.08); box-shadow: 0 0 14px #ef4444; }
        }
        @keyframes pulseYellow {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }
        .car-icon-body {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="hud-painel">
        <div class="hud-titulo">

                <div class="valor" id="status-veiculo" style="font-size: 13px; color: #4ade80;">

            </div>
            <div class="hud-caixa" style="grid-column: span 2;">
                <div class="label">Via Atual</div>
                <div class="valor" id="via-atual" style="font-size: 13px; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">

                </div>
            </div>
        </div>

        <div class="hud-controles">
            <button class="hud-btn" id="btn-play">▶️ Iniciar</button>
            <button class="hud-btn hud-btn-reset" id="btn-reset">🔄 Reset</button>
            <select class="hud-select" id="sel-vel">

                <option value="8">8x</option>

            </select>
        </div>

        <div class="hud-progresso">
            <div class="hud-barra" id="hud-barra"></div>
        </div>
    </div>

        var vias = ["Avenida Ivo do Prado", "Avenida Ivo do Prado", "Travessa Jos\u00e9 Faro Rolemberg", "Travessa Jos\u00e9 Faro Rolemberg", "Pra\u00e7a Ol\u00edmpio Campos", "Pra\u00e7a Ol\u00edmpio Campos", "Rua Itaporanga", "Rua Itaporanga", "Rua Itaporanga", "Rua Itaporanga", "Rua Itaporanga", "Rua Itaporanga", "Rua Arist\u00eddes Bispo", "Travessa Luiz Carlos Hardman Cortes", "Rua Nossa Senhora das Dores", "Rua Nossa Senhora das Dores", "Rua Est\u00e2ncia", "Rua Est\u00e2ncia", "Rua Est\u00e2ncia", "Rua Rafael de Aguiar", "Rua Rafael de Aguiar", "Rua Rafael de Aguiar", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Avenida Desembargador Maynard", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Rua Doutor Jos\u00e9 da Silva Ribeiro Filho", "Avenida Marechal C\u00e2ndido Mariano da Silva Rondon", "Via sem nome", "Via sem nome", "Via sem nome", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida G         var semaforos = [{"lat": -10.9127998, "lon": -37.0479697, "node": "951730159"}, {"lat": -10.9139303, "lon": -37.0527351, "node": "951730183"}, {"lat": -10.913942, "lon": -37.053887, "node": "951730178"}, {"lat": -10.9139652, "lon": -37.0550086, "node": "960563542"}, {"lat": -10.9139674, "lon": -37.0551336, "node": "951730173"}, {"lat": -10.9140301, "lon": -37.0574365, "node": "951730166"}, {"lat": -10.9186094, "lon": -37.0645361, "node": "951669074"}, {"lat": -10.918696, "lon": -37.0693284, "node": "1813051531"}, {"lat": -10.9186939, "lon": -37.069479, "node": "1868023282"}, {"lat": -10.918516, "lon": -37.0711973, "node": "3023126573"}, {"lat": -10.9184024, "lon": -37.0722099, "node": "951653830"}, {"lat": -10.9183269, "lon": -37.0746423, "node": "1868072268"}, {"lat": -10.9185217, "lon": -37.0789298, "node": "1460629652"}, {"lat": -10.9185609, "lon": -37.0798703, "node": "1341153434"}];
        var paradas = new Set([7, 10, 24, 33, 36, 39, 42]);
        var totalDistKm = 9.21039939153078;
        var totalTempoMin = 11.09431177250873;

        // 1. Inicializar Mapa Leaflet
        var map = L.map('map', {
            center: [-10.920287203783547, -37.07998933042058],
            zoom: 13,

        });

        // 2. Camadas de Mapa Base (Sem erro 403 do OpenStreetMap)
        var mapaRuas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Street Map'
        }).addTo(map);

        var mapaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,

        L.control.layers({

        // 3. Traçado da Rota com Classe CSS Animada

        map.fitBounds(polyline.getBounds(), { padding: [60, 60] });

        var carMarker = L.marker(coords[0], { icon: carIcon, zIndexOffset: 1000 }).addTo(map);

        // 8. Lógica de Simulação com Parada Real nos Semáforos
        var currentIndex = 0;

        var statusVeiculo = document.getElementById('status-veiculo');
        var hudBarra = document.getElementById('hud-barra');

        function step() {
            if (!isRunning) return;

            var carBadge = document.getElementById('car-badge');

            // Se o carro está aguardando o semáforo abrir
            if (waitTicks > 0) {
                waitTicks--;
                if (waitTicks === 1) {
                    if (carBadge) {
                        carBadge.className = 'car-badge badge-yellow';
                        carBadge.innerText = '🟡 Abrindo...';
                    }
                    statusVeiculo.style.color = '#fde047';

                    statusVeiculo.style.color = '#f87171';

            } else if (paradas.has(currentIndex) && !visitados.has(currentIndex)) {

                paradasFeitas++;
                waitTicks = 10;
                semAtual.innerText = paradasFeitas + ' / ' + paradas.size + ' 🛑';
                if (carBadge) {

                        carBadge.className = 'car-badge badge-green';
                        carBadge.innerText = '🟢 Em movimento';
                    }
                    statusVeiculo.style.color = '#4ade80';

                    var pct = (currentIndex / (coords.length - 1)) * 100;
                    hudBarra.style.width = pct + '%';

                    var dKm = (currentIndex / (coords.length - 1)) * totalDistKm;
                    distAtual.innerText = dKm.toFixed(2) + ' km';

                    if (currentIndex - 1 < vias.length) {
                        viaAtual.innerText = vias[currentIndex - 1];
                    }
                } else {
                    isRunning = false;
                    btnPlay.innerText = '▶️ Reiniciar';
                    viaAtual.innerText = 'Chegada: UFS (Campus São Cristóvão) 🎓';
                    statusVeiculo.style.color = '#38bdf8';

                    if (carBadge) {
                        carBadge.className = 'car-badge badge-green';
                        carBadge.innerText = '🏁 Chegou na UFS!';
                    }
                    hudBarra.style.width = '100%';
                    return;
                }
            }

            var delayMs = Math.max(25, 260 / velMult);
            timerId = setTimeout(step, delayMs);
        }

        btnPlay.onclick = function() {
            if (isRunning) {
                isRunning = false;
                clearTimeout(timerId);
                btnPlay.innerText = '▶️ Continuar';
            } else {
                if (currentIndex >= coords.length - 1) {
                    currentIndex = 0;
                    visitados.clear();
                    waitTicks = 0;
                    paradasFeitas = 0;

            currentIndex = 0;
            waitTicks = 0;
            paradasFeitas = 0;
            visitados.clear();
            carMarker.setLatLng(coords[0]);
            hudBarra.style.width = '0%';
            distAtual.innerText = '0.00 km';
            semAtual.innerText = '0 / ' + paradas.size + ' 🛑';
            viaAtual.innerText = 'Iniciando trajeto...';
            statusVeiculo.style.color = '#4ade80';
            statusVeiculo.innerText = '🟢 Pronto para iniciar';
            var carBadge = document.getElementById('car-badge');
            if (carBadge) {
                carBadge.className = 'car-badge badge-green';
                carBadge.innerText = '🟢 Pronto';
            }
            btnPlay.innerText = '▶️ Iniciar';
        };
    </script>
</body>
</html>
