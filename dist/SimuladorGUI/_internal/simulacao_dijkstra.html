<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação: Rota Dijkstra (Aracaju ➔ UFS)</title>
    <!-- Leaflet CSS & JS Oficiais (CDN cdnjs) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e2e8f0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Animação SVG nativa para a linha de rota */
        .rota-animada {
            stroke-dasharray: 12, 12;
            animation: dashRota 1.2s linear infinite;
        }
        @keyframes dashRota {
            to { stroke-dashoffset: -24; }
        }
        /* HUD Flutuante */
        .hud-painel {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.96);
            color: #f8fafc;
            padding: 20px 24px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            min-width: 350px;
            max-width: 440px;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
        }
        .hud-titulo {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .hud-metricas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .hud-caixa {
            background: rgba(255,255,255,0.06);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .hud-caixa .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
        }
        .hud-caixa .valor {
            font-size: 16px;
            font-weight: 700;
            color: #4ade80;
            margin-top: 2px;
        }
        .hud-controles {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }
        .hud-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .hud-btn-reset {
            background: #475569;
        }
        .hud-btn-reset:hover {
            background: #334155;
        }
        .hud-select {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .hud-progresso {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            margin-top: 14px;
            overflow: hidden;
        }
        .hud-barra {
            width: 0%;
            height: 100%;
            background: #38bdf8;
            transition: width 0.15s ease-out;
        }
        /* Marcador de Carro com Badge de Estado Semafórico */
        .car-marker-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            margin-left: -70px;
            margin-top: -42px;
            pointer-events: none;
        }
        .car-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            color: #fff;
            white-space: nowrap;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            margin-bottom: 2px;
            transition: all 0.2s ease;
        }
        .badge-green {
            background: #16a34a;
            border: 1px solid #4ade80;
        }
        .badge-yellow {
            background: #d97706;
            border: 1px solid #fde047;
            animation: pulseYellow 0.6s infinite alternate;
        }
        .badge-red {
            background: #dc2626;
            border: 1px solid #f87171;
            animation: pulseRed 0.6s infinite alternate;
        }
        @keyframes pulseRed {
            from { transform: scale(1); box-shadow: 0 0 5px #ef4444; }
            to { transform: scale(1.08); box-shadow: 0 0 14px #ef4444; }
        }
        @keyframes pulseYellow {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }
        .car-icon-body {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="hud-painel">

            </div>

        <div class="hud-controles">

        <div class="hud-progresso">

        </div>
    </div>

 "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Rua F", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Avenida Jos\u00e9 Correia Santos Neto", "Rua B", "Rua I", "Rua A", "Avenida Chesf", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas", "Avenida Governador Marcelo D\u00e9da Chagas"];

        }).addTo(map);

        var mapaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {

        var mapaCarto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {

        L.control.layers({

        var carMarker = L.marker(coords[0], { icon: carIcon, zIndexOffset: 1000 }).addTo(map);

        function step() {
            if (!isRunning) return;

            var carBadge = document.getElementById('car-badge');

            // Se o carro está aguardando o semáforo abrir
            if (waitTicks > 0) {
                waitTicks--;
                if (waitTicks === 1) {
                    if (carBadge) {
                        carBadge.className = 'car-badge badge-yellow';
                        carBadge.innerText = '🟡 Abrindo...';

                    statusVeiculo.style.color = '#fde047';

                paradasFeitas++;
                waitTicks = 10;
                semAtual.innerText = paradasFeitas + ' / ' + paradas.size + ' 🛑';

                    statusVeiculo.style.color = '#4ade80';

                    hudBarra.style.width = pct + '%';

                    var dKm = (currentIndex / (coords.length - 1)) * totalDistKm;
                    distAtual.innerText = dKm.toFixed(2) + ' km';

                    if (currentIndex - 1 < vias.length) {
                        viaAtual.innerText = vias[currentIndex - 1];
                    }

                    isRunning = false;
                    btnPlay.innerText = '▶️ Reiniciar';
                    viaAtual.innerText = 'Chegada: UFS (Campus São Cristóvão) 🎓';

                        carBadge.innerText = '🏁 Chegou na UFS!';
                    }
                    hudBarra.style.width = '100%';
                    return;
                }
            }

            var velMult = parseFloat(selVel.value);
            var delayMs = Math.max(25, 260 / velMult);
            timerId = setTimeout(step, delayMs);
        }

                carBadge.className = 'car-badge badge-green';
                carBadge.innerText = '🟢 Pronto';
            }
            btnPlay.innerText = '▶️ Iniciar';
        };
